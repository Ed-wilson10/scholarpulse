services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: scholarpulse
      POSTGRES_USER: scholarpulse
      POSTGRES_PASSWORD: scholarpulse
    ports:
      - "5432:5432"
    volumes:
      - scholarpulse_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scholarpulse"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DJANGO_SECRET_KEY: change-me-in-production
      DJANGO_DEBUG: "1"
      DJANGO_ALLOWED_HOSTS: "*"
      POSTGRES_DB: scholarpulse
      POSTGRES_USER: scholarpulse
      POSTGRES_PASSWORD: scholarpulse
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000"
    command: >
      sh -c "python manage.py migrate &&
             python manage.py seed &&
             python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000/api
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api
      API_INTERNAL_URL: http://backend:8000/api
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  scholarpulse_pgdata:
